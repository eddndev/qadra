name: Deploy to Hostgator (Production)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@master
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          envs: NOVA_USERNAME,NOVA_LICENSE_KEY
          script: |
            set -e
            
            # --- CONFIGURACIÓN DE RUTAS ---
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"
            COMPOSER_BIN="/opt/cpanel/composer/bin/composer"

            echo "🚀 Iniciando despliegue..."
            
            cd ${{ secrets.PROJECT_PATH }}

            # 1. Poner en mantenimiento
            $PHP_BIN artisan down || true

            # 2. Actualizar código
            git reset --hard HEAD
            git pull origin main

            # 3. Instalar dependencias
            export COMPOSER_ALLOW_SUPERUSER=1
            
            # Autenticar Nova (usando variables de entorno pasadas desde GitHub Secrets)
            # Esto evita que intente clonar via git/ssh
            if [ ! -z "$NOVA_USERNAME" ] && [ ! -z "$NOVA_LICENSE_KEY" ]; then
                echo "🔑 Configurando autenticación de Laravel Nova..."
                $PHP_BIN $COMPOSER_BIN config http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"
            fi

            echo "📦 Instalando dependencias..."
            $PHP_BIN $COMPOSER_BIN install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 4. Base de datos y Limpieza
            echo "🗄️  Migrando base de datos..."
            $PHP_BIN artisan migrate --force

            echo "🌱 Sembrando datos..."
            $PHP_BIN artisan db:seed --force
            
            echo "🧹 Limpiando cachés..."
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan event:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache

            # 5. Levantar el sitio
            $PHP_BIN artisan up
            
            echo "✅ ¡Despliegue Exitoso!"

      - name: Upload Built Assets to Hostgator
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: "public/build"
          target: ${{ secrets.PROJECT_PATH }}